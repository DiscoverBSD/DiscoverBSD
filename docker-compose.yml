
version: '3'
services:
  db:
    image: postgres
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5431:5432"
    network_mode: "bridge"
  web:
    build: .
    command: bash -c "rm -rf ./tmp/pids/server.pid && ./bin/dev"
    volumes:
      - .:/discoverbsd
    ports:
      - "3000:3000"
    depends_on:
      - db
    links:
      - db:db
    network_mode: "bridge"
